<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galéria — BARBERIS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600&family=Fraunces:wght@600&family=Work+Sans:wght@400;600;700&display=swap">
<style>
  :root {
    --bg: #141311;
    --card: #1a1815;
    --cream: #f4ede1;
    --cream-dim: #cfc6b8;
    --bronze: #c9a06a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background-color: var(--bg);
    background-image: repeating-linear-gradient(135deg, rgba(201,160,106,0.055) 0px, rgba(201,160,106,0.055) 2px, transparent 2px, transparent 26px);
    font-family: 'Work Sans', sans-serif;
    color: var(--cream);
  }
  h1, h2, h3 { font-family: 'Fraunces', serif; font-weight: 600; margin: 0; }
  a { color: inherit; text-decoration: none; }
  .wrap { width: 100%; max-width: 480px; margin: 0 auto; position: relative; display: flex; flex-direction: column; }
  .topbar { position: sticky; top: 0; z-index: 20; height: 64px; flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; background: rgba(20,19,17,0.9); backdrop-filter: blur(4px); border-bottom: 1px solid rgba(244,237,225,0.08); }
  .back-link { display: flex; align-items: center; gap: 8px; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--cream-dim); transition: color 0.2s ease; }
  .back-link:hover { color: var(--bronze); }
  .full-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; padding: 20px 20px 0; }
  .photo-frame {
    position: relative;
    background: var(--card);
    padding: 8px 8px 8px;
    border: 1px solid rgba(201,160,106,0.35);
    border-radius: 3px;
    box-shadow: 0 10px 24px -12px rgba(0,0,0,0.6);
  }
  .photo-frame .frame-inner { position: relative; overflow: hidden; border-radius: 1px; }
  .photo-frame img { width: 100%; height: 100%; object-fit: cover; display: block; aspect-ratio: 1/1; cursor: zoom-in; transition: opacity 0.2s ease, transform 0.3s ease; }
  .photo-frame img:hover { opacity: 0.88; transform: scale(1.03); }
  .photo-number {
    position: absolute;
    top: 6px;
    left: 6px;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 24px;
    height: 24px;
    padding: 0 6px;
    background: rgba(20,19,17,0.75);
    border: 1px solid var(--bronze);
    border-radius: 2px;
    color: var(--bronze);
    font-family: 'Fraunces', serif;
    font-size: 11px;
    letter-spacing: 0.04em;
    backdrop-filter: blur(2px);
  }
  .btn-cta { transition: transform 0.25s cubic-bezier(.16,.6,.2,1), box-shadow 0.25s ease, background 0.25s ease; box-shadow: 0 8px 22px -8px rgba(201,160,106,0.55); }
  .btn-cta:hover { background: #d8af78; box-shadow: 0 10px 26px -6px rgba(201,160,106,0.7); transform: translateY(-2px); }
  .gallery-instagram {
    margin: 8px 24px 0;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 18px;
    background: var(--card);
    border: 1px solid rgba(201,160,106,0.3);
    border-radius: 4px;
  }
  .gallery-instagram svg { flex: 0 0 auto; color: var(--bronze); }
  .gallery-instagram .gi-label { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--cream-dim); }
  .gallery-instagram .gi-handle { font-family: 'Fraunces', serif; font-size: 16px; color: var(--cream); margin-top: 2px; }
  .gallery-instagram .gi-arrow { margin-left: auto; color: var(--bronze); font-size: 18px; }
  .lightbox { position: fixed; inset: 0; z-index: 50; background: rgba(10,9,8,0.95); display: none; align-items: center; justify-content: center; padding: 24px; }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: 3px; }
  .lightbox-close { position: absolute; top: 20px; right: 20px; background: none; border: none; color: var(--cream); font-size: 30px; line-height: 1; cursor: pointer; padding: 6px; }

  /* Rámčeky, číslovanie, pásikavé pozadie a Instagram box sú len pre mobilné zobrazenie */
  @media (min-width: 641px) {
    body { background-image: none; }
    .full-grid { gap: 8px; }
    .photo-frame { background: none; padding: 0; border: none; border-radius: 0; box-shadow: none; }
    .photo-frame img { border-radius: 2px; }
    .photo-number { display: none; }
    .gallery-instagram { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <a href="index.html" class="back-link"><span>←</span> Späť domov</a>
    <span style="font-family:'Fraunces',serif;font-weight:600;font-size:17px;">BARBERIS</span>
  </div>

  <div style="padding:36px 24px 0;text-align:center;">
    <div style="display:flex;align-items:center;justify-content:center;gap:10px;font-size:10.5px;letter-spacing:0.16em;text-transform:uppercase;color:var(--bronze);margin-bottom:6px;">
      <span style="width:4px;height:4px;border-radius:50%;background:var(--bronze);"></span>
      <span>Naša práca</span>
      <span style="width:4px;height:4px;border-radius:50%;background:var(--bronze);"></span>
    </div>
    <h1 style="font-size:26px;margin-bottom:8px;">GALÉRIA</h1>
    <p style="margin:0;font-size:13px;line-height:1.55;color:var(--cream-dim);">Priestor, atmosféra a naša práca — presne taká, akú u nás nájdeš.</p>
  </div>

  <div class="full-grid" id="grid">
    <div class="photo-frame"><span class="photo-number">01</span><div class="frame-inner"><img src="assets/gallery/gallery-1.jpg" alt="Priestor BARBERIS"></div></div>
    <div class="photo-frame"><span class="photo-number">02</span><div class="frame-inner"><img src="assets/gallery/gallery-2.jpg" alt="Práca v BARBERIS"></div></div>
    <div class="photo-frame"><span class="photo-number">03</span><div class="frame-inner"><img src="assets/gallery/gallery-3.jpg" alt="Práca v BARBERIS"></div></div>
    <div class="photo-frame"><span class="photo-number">04</span><div class="frame-inner"><img src="assets/gallery/gallery-4.jpg" alt="Práca v BARBERIS"></div></div>
    <div class="photo-frame"><span class="photo-number">05</span><div class="frame-inner"><img src="assets/gallery/gallery-5.jpg" alt="Práca v BARBERIS"></div></div>
    <div class="photo-frame"><span class="photo-number">06</span><div class="frame-inner"><img src="assets/gallery/gallery-6.jpg" alt="Práca v BARBERIS"></div></div>
    <div class="photo-frame"><span class="photo-number">07</span><div class="frame-inner"><img src="assets/gallery/gallery-7.jpg" alt="Práca v BARBERIS"></div></div>
    <div class="photo-frame"><span class="photo-number">08</span><div class="frame-inner"><img src="assets/gallery/gallery-8.jpg" alt="Práca v BARBERIS"></div></div>
    <div class="photo-frame"><span class="photo-number">09</span><div class="frame-inner"><img src="assets/gallery/gallery-9.jpg" alt="Práca v BARBERIS"></div></div>
  </div>

  <a href="https://instagram.com/barberis" target="_blank" rel="noopener" class="gallery-instagram">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.5" cy="6.5" r="0.8" fill="currentColor" stroke="none"></circle></svg>
    <div>
      <div class="gi-label">Sleduj nás</div>
      <div class="gi-handle">@barberis</div>
    </div>
    <span class="gi-arrow">→</span>
  </a>

  <div style="padding:32px 24px 48px;">
    <a href="index.html#booking" class="btn-cta" style="display:block;background:var(--bronze);color:#141311;text-align:center;padding:16px;border-radius:2px;font-weight:700;font-size:12.5px;letter-spacing:0.07em;text-transform:uppercase;">Zarezervovať termín →</a>
  </div>

</div>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightbox-close" aria-label="Zavrieť">&times;</button>
  <img id="lightbox-img" src="" alt="">
</div>

<script>
  (function () {
    var grid = document.getElementById('grid');
    var lightbox = document.getElementById('lightbox');
    var lightboxImg = document.getElementById('lightbox-img');
    var closeBtn = document.getElementById('lightbox-close');
    grid.querySelectorAll('img').forEach(function (img) {
      img.addEventListener('click', function () {
        lightboxImg.src = img.src;
        lightboxImg.alt = img.alt;
        lightbox.classList.add('open');
      });
    });
    function close() { lightbox.classList.remove('open'); lightboxImg.src = ''; }
    closeBtn.addEventListener('click', close);
    lightbox.addEventListener('click', function (e) { if (e.target === lightbox) close(); });
  })();
</script>
</body>
</html>
